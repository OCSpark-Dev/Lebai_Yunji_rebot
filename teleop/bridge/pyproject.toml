[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lm3-teleop-bridge"
version = "0.1.0"
description = "Fail-closed LM3-UP mobile teleoperation and VLA data bridge"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "websockets>=14,<17",
]

[project.optional-dependencies]
camera = ["opencv-python>=4.10"]
export = ["lerobot==0.4.2", "pillow>=10"]
test = ["pytest>=8"]

[project.scripts]
lm3-teleop-bridge = "lm3_teleop_bridge.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
